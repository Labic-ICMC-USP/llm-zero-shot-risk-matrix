[project]
name = "risk-matrix-scorer"
version = "0.1.0"
description = "Score incident severity and likelihood with an LLM and output a risk matrix CSV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "tqdm>=4.60",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
risk-scorer = "risk_scorer.risk_scorer:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]